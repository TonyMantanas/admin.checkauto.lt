<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://ddhhhieitupjixynjrry.supabase.co; form-action 'self'; upgrade-insecure-requests">
  <script src="../js/frame-guard.js?v=20260730-1"></script>
  <title>Reset password · checkauto.lt</title>
  <link rel="stylesheet" href="../admin.css?v=20260802-5">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body class="admin-page admin-login-page admin-reset-page" data-admin-page="reset-password">
  <a class="admin-skip-link" href="#admin-main">Skip to main content</a>
  <div class="admin-app">
    <main id="admin-main" tabindex="-1">
      <section class="admin-login" aria-label="Reset admin account password">
        <div class="admin-login-panel admin-reset-panel">
          <div class="admin-brand">check<span>auto</span>.lt</div>
          <h1 id="reset-page-title" data-reset-page-title tabindex="-1">Reset password</h1>

          <p
            class="admin-login-session"
            data-reset-loading
            role="status"
            aria-live="polite"
          >Validating the reset link…</p>

          <section class="admin-mfa-step" data-reset-mfa hidden aria-labelledby="reset-page-title">
            <form data-reset-mfa-form novalidate>
              <label data-reset-factor-row hidden>
                Authenticator
                <select name="factorId"></select>
              </label>
              <label>
                Verification code
                <input
                  name="verificationCode"
                  type="text"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  pattern="[0-9]{6}"
                  maxlength="6"
                  required
                >
              </label>
              <p class="admin-status" data-reset-mfa-status role="status" aria-live="polite"></p>
              <button class="admin-button admin-button-primary" type="submit">Verify</button>
            </form>
          </section>

          <section class="admin-mfa-step" data-reset-password hidden aria-labelledby="reset-page-title">
            <form data-reset-password-form novalidate>
              <label>
                New password
                <input
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  autocapitalize="none"
                  spellcheck="false"
                  required
                >
              </label>
              <label>
                Confirm new password
                <input
                  name="passwordConfirmation"
                  type="password"
                  autocomplete="new-password"
                  autocapitalize="none"
                  spellcheck="false"
                  required
                >
              </label>
              <p class="admin-status" data-reset-password-status role="status" aria-live="polite"></p>
              <button class="admin-button admin-button-primary" type="submit">Change password</button>
            </form>
          </section>

          <section class="admin-reset-result" data-reset-error hidden aria-labelledby="reset-error-title" role="alert" tabindex="-1">
            <h2 id="reset-error-title" tabindex="-1">This reset link can’t be used</h2>
            <p data-reset-error-message>
              It may have expired, already been used, or been replaced by a newer request.
            </p>
            <a class="admin-button admin-button-secondary" href="../login/">Return to sign in</a>
          </section>

          <section class="admin-reset-result" data-reset-success hidden aria-labelledby="reset-page-title" role="status" aria-live="polite" tabindex="-1">
            <p>Sign in with your new password.</p>
            <a class="admin-button admin-button-primary" href="../login/">Sign in again</a>
          </section>

        </div>
      </section>
    </main>
  </div>

  <script type="module" src="../js/reset-password.js?v=20260802-2"></script>
</body>
</html>
